<!DOCTYPE html>

<head>

  <title>Studio — Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="nav__logo" href="index.html">Studio</a>
      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav__menu" id="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="photography.html" aria-current="page">Photography</a></li>
        <li><a href="painting.html">Painting</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <main class="page page--gallery">
    <header class="page-header">
      <h1>Photography</h1>
      <p>Landscapes, portraits, and everyday light.</p>
    </header>
    <div class="gallery" data-gallery="photography"></div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Studio. All rights reserved.</p>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
    <button class="lightbox__close" type="button" aria-label="Close preview">&times;</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Previous image">&#8249;</button>
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next image">&#8250;</button>
    <figure class="lightbox__figure">
      <img class="lightbox__img" src="" alt="">
      <figcaption class="lightbox__caption"></figcaption>
    </figure>
  </div>

  <script src="js/gallery-data.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/nav.js"></script>
